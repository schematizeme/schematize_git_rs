name: release

# POR QUE ISTO EXISTE
#
# Sem release, `releases/latest/download/` não serve nada e o app só chega em quem compila do
# fonte. Foi a dívida nº 1 do `schematize_cli_rs` — os releases ficaram 19 versões atrás do
# `main`, e foi essa defasagem que quebrou o `curl | bash` de todo mundo.
#
# Aqui o release nasce com o repo, e a tag é o gatilho: cortar tag É publicar.
#
# ESTE ARQUIVO NASCE JUNTO COM O APP, e é de propósito: o release não pode ser o que se faz
# depois. O `schematize_cli_rs` deixou os releases ficarem 19 versões atrás do `main`, e foi
# essa defasagem que quebrou o `curl | bash` de todo mundo. O optimizer repetiu a lacuna em
# menor escala (tinha CI e nenhum release). Aqui a tag É a publicação, desde o primeiro dia.
#
# A JANELA SAI DAQUI MESMO, e é o ponto do ADR-0020. Ela é o segundo `[[bin]]` deste repo, então
# `cargo build --release` já a produz: **não há `git clone` de repo de janela neste arquivo**.
#
# Nos irmãos (market, optimizer, deployer) esse clone existe e é `continue-on-error` por desenho —
# a janela é acessório e não deve derrubar o release do CLI. O preço apareceu inteiro: dois repos
# davam 404 e o release saía VERDE com um asset a menos, em silêncio. Sem clone, esse modo de
# falha não existe aqui: ou os dois binários saem do mesmo commit, ou o job reprova.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  criar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cria o release (rascunho vira público ao fim)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" \
                 --title "${GITHUB_REF_NAME}" \
                 --notes "schematize git ${GITHUB_REF_NAME} — contas, repositórios e o que ainda não saiu da máquina."

  binarios:
    needs: criar
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset: schematize-git-linux-x86_64
            asset_gui: schematize-git-gui-linux-x86_64
          # `macos-15` e nao `macos-14`: a 14 ja esta marcada DEPRECATED no
          # `actions/runner-images` (issue 13518), a caminho do mesmo destino da 13 descrito
          # logo abaixo. Trocar antes de a imagem sumir custa esta linha.
          - runner: macos-15
            asset: schematize-git-macos-arm64
            asset_gui: schematize-git-gui-macos-arm64
          # Intel CROSS-COMPILADO no runner arm64, e nao numa imagem macOS x64.
          #
          # A familia de imagens x64 do macOS e a que vem sendo aposentada, e o modo de falha
          # dela e o pior possivel: o job nao reprova, fica *queued* para sempre e segura o
          # release inteiro. Ja aconteceu neste ecossistema (CONTEXT.md §4) com a `macos-13`;
          # a `macos-14` esta DEPRECATED agora (actions/runner-images issue 13518); e a
          # `macos-15-intel`, embora valida, e desconhecida do actionlint 1.7.7 — o que
          # deixava o gate deste repo vermelho por falso positivo.
          #
          # Cross-compilar tira o repo dessa esteira inteira: um runner arm64 so, dois alvos.
          # E o mesmo desenho que o CLI, o updater e o market ja usam.
          - runner: macos-15
            target: x86_64-apple-darwin
            asset: schematize-git-macos-x86_64
            asset_gui: schematize-git-gui-macos-x86_64
          - runner: windows-latest
            asset: schematize-git-windows-x86_64.exe
            asset_gui: schematize-git-gui-windows-x86_64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # Só no Linux: macOS e Windows linkam o Slint contra o SDK do próprio sistema.
      - name: deps de sistema (Slint)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            pkg-config \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-relcargo-${{ hashFiles('**/Cargo.lock') }}

      # `--locked` de propósito: o binário de uma tag tem de vir do lock DAQUELA tag.
      # Sem isso, recompilar a mesma tag pode dar outro binário — que foi exatamente a
      # dívida que o `schematize_cli_rs` levou meses para pagar.
      #
      # `matrix.target` so existe na linha do Intel cross-compilado; nas outras o build e
      # nativo e o alvo default do runner ja e o certo.
      - name: alvo de cross-compilacao
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: build release
        run: cargo build --release --locked ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: renomeia p/ o nome estável do asset
        shell: bash
        run: |
          set -euo pipefail
          dir="target/${{ matrix.target }}/release"
          [ -n "${{ matrix.target }}" ] || dir="target/release"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$dir/schematize-git.exe"     "${{ matrix.asset }}"
            cp "$dir/schematize-git-gui.exe" "${{ matrix.asset_gui }}"
          else
            cp "$dir/schematize-git"     "${{ matrix.asset }}"
            cp "$dir/schematize-git-gui" "${{ matrix.asset_gui }}"
          fi
          # **Sem `|| true` em nenhum dos `cp`, e é deliberado.** Janela que não compilou tem de
          # reprovar o job: publicar o CLI sem a janela é o release "verde com um asset a menos"
          # que este repo foi desenhado para não repetir.

      - name: publica
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" \
            "${{ matrix.asset }}" "${{ matrix.asset_gui }}" --clobber

  # FreeBSD x86_64 — job PRÓPRIO: o runner não é FreeBSD, e `fail-fast` da matriz `binarios`
  # nem se aplica aqui. FreeBSD falhar NÃO cancela os outros assets (e o contrário também).
  # O binário TEM de executar num FreeBSD de verdade antes de ser publicado: um asset que baixa
  # com HTTP 200 e não executa só falha na máquina de quem instalou. Por isso o smoke
  # (`--version` numa VM FreeBSD 14.2) é parte do release, não enfeite.
  # Tudo PINADO: a VM por SHA de commit (tag v1.5.9) e o release do FreeBSD fixo.
  build-freebsd:
    needs: criar
    runs-on: ubuntu-latest
    env:
      ASSET: schematize-git-freebsd-x86_64
      ASSET_GUI: schematize-git-gui-freebsd-x86_64
    steps:
      - uses: actions/checkout@v4
      # CLI e janela moram no MESMO pacote, e o pacote depende do Slint (fontconfig-sys etc.), que
      # NÃO cross-compila (pkg-config sem sysroot do alvo). Por isso aqui tudo compila NATIVO na
      # VM FreeBSD — um build só, o CLI primeiro (obrigatório, com smoke) e a janela depois.
      - name: Build + smoke (VM FreeBSD)
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          envs: "ASSET ASSET_GUI"
          release: "14.2"
          usesh: true
          copyback: true
          prepare: |
            pkg install -y git curl pkgconf libX11 libXcursor libXrandr libXi \
              libxkbcommon wayland mesa-libs libxcb fontconfig dejavu
          run: |
            set -eu
            # Toolchain via rustup: o rustc do pkg do FreeBSD 14.2 e antigo demais (lockfile v4, MSRV do Slint).
            fetch -o /tmp/rustup.sh https://sh.rustup.rs
            sh /tmp/rustup.sh -y --profile minimal --default-toolchain stable
            PATH="$HOME/.cargo/bin:$PATH"; export PATH
            rustc --version; cargo --version
            # cb: roda cargo com log; se falhar, ecoa as ultimas 40 linhas como ::error:: (annotation legivel).
            cb() {
              if cargo "$@" > /tmp/build.log 2>&1; then return 0; fi
              tail -40 /tmp/build.log | sed 's/^/::error::/'
              return 1
            }
            export CARGO_TARGET_DIR=/tmp/alvo
            cb build --release --locked --bin schematize-git
            cp /tmp/alvo/release/schematize-git ./$ASSET
            test -s ./$ASSET
            # O binário TEM de executar num FreeBSD de verdade antes de ser publicado.
            uname -sr
            [ "$(uname -s)" = "FreeBSD" ]
            chmod +x ./$ASSET
            out="$(SCHEMATIZE_SEM_MARKET=1 ./$ASSET --version)"
            echo "$out"
            case "$out" in
              schematize-git\ *) ;;
              *) echo "saída de --version inesperada: $out" >&2; exit 1 ;;
            esac
            # A JANELA é best-effort: se não compilar, o release NÃO falha (o CLI é o que
            # precisa chegar). Reaproveita o target do CLI, então só compila o que falta.
            if cb build --release --locked --bin schematize-git-gui; then
              cp /tmp/alvo/release/schematize-git-gui ./$ASSET_GUI
            else
              echo "janela não compilou no FreeBSD — segue só com o CLI" >&2
            fi
      - name: A janela compilou?
        id: janela
        continue-on-error: true
        run: test -s "$ASSET_GUI"

      - name: publica
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "$ASSET" --clobber

      - name: publica a janela
        if: steps.janela.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "$ASSET_GUI" --clobber
